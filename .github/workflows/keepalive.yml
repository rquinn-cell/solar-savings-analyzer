name: Streamlit Keep-Alive

on:
  schedule:
    # Runs every 12 hours (Streamlit apps sleep after 48 consecutive hours of inactivity)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows you to trigger it manually from GitHub for testing

jobs:
  wake-up-app:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Selenium
        run: pip install selenium

      - name: Execute Headless Browser Wakeup
        run: |
          python - <<EOF
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          # 1. Configure Chrome to run headlessly in the GitHub runner
          chrome_options = Options()
          chrome_options.add_argument("--headless=new")
          chrome_options.add_argument("--no-sandbox")
          chrome_options.add_argument("--disable-dev-shm-usage")

          driver = webdriver.Chrome(options=chrome_options)
          
          try:
              print("Launching browser and hitting secure Streamlit endpoint...")
              target_url = "https://solar-savings-analyzer.streamlit.app/?action_wakeup=secure_runner_77&source=github_action_keepalive"
              driver.get(target_url)
              
              # 2. Give Streamlit 15 seconds to execute your top-level database script
              print("Waiting for Streamlit app execution and database logging...")
              time.sleep(15)
              print("Wakeup sequence successfully completed!")
          except Exception as e:
              print(f"Browser automation failed: {e}")
          finally:
              driver.quit()
          EOF